[package]
name = "candle-rocm"
version = "0.2.0"
edition = "2021"
description = "ROCm/HIP backend for candle ML framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nu11ified/candle-rocm"

[dependencies]
candle-core = { path = "../candle-core", features = ["rocm"] }

[dev-dependencies]
candle-nn = { path = "../candle-nn", features = ["rocm"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }
